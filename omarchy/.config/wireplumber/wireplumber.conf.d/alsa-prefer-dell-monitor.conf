## Dell U4025QW over DP. ALSA gives HDMI sinks a low priority.session (696 here),
## so WirePlumber's fallback picks USB Audio whenever the last-chosen sink (AirPods)
## is absent. Outrank every other sink; explicit picks still win (+30000).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.pci-0000_03_00.1.hdmi-stereo" } ]
    actions = { update-props = { priority.session = 2000 } }
  }
]
