# Retina-class 2.8K internal panel
env = GDK_SCALE, 2

# NOTE: no `monitor =` lines here on purpose. This laptop's layout changes with
# the desk, so it is owned by hyprmon in ~/.config/hypr/monitors.conf, which
# hyprland.conf sources after this file. A monitor rule added here would be
# overridden by hyprmon anyway -- and worse, would silently fight it.
#
# Lid handling, if ever wanted. These hardcode an eDP-1 geometry that will
# disagree with whatever hyprmon last applied, so they stay off for now;
# omarchy-hw-external-monitors / omarchy-hw-recover-internal-monitor are the
# smarter building blocks.
# bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
# bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 2880x1800@120, 0x0, 1.666667"

general {
    gaps_in = 4
    gaps_out = 4
}
