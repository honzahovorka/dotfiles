onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "black"

[ui]
accent = "blue"

[ui.toast]
delivery = "off"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+space"
type = "shell"
command = "herdr plugin pane open --plugin kichel.muster --entrypoint picker"
description = "project switcher"
